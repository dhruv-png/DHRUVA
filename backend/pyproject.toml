# D.H.R.U.V.A backend - build, dependency and quality-tool configuration.
# Governing document: docs/DHRUVA_MASTER_PROJECT_PLAN.md v1.1
# Toolchain decisions: ADR-024 (strict typing), section 13.3.

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "dhruva"
description = "Dynamic Heuristic Regime Understanding & Volatility Analytics"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "drew" }]
dynamic = ["version"]
classifiers = [
  "Private :: Do Not Upload",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
# Every runtime dependency is pinned exactly (ADR-032) and justified in the
# design document of the subsystem that introduced it. Transitive pins live in
# uv.lock, which is committed and enforced with UV_FROZEN=1 in CI.
#
# S02 -- Core Runtime:
#   pydantic / pydantic-settings  typed, fail-fast configuration (ADR-031)
#   structlog                     structured logging with a redaction processor
#   fastapi / uvicorn             the /health /ready /metrics component (ADR-035)
#   prometheus-client             metrics registry and exposition (ADR-035)
#   opentelemetry-api             tracing facade; the SDK is a composition-root
#                                 concern and is an optional extra, not a
#                                 library dependency (ADR-040)
dependencies = [
  "pydantic==2.12.3",
  "pydantic-settings==2.11.0",
  "structlog==25.4.0",
  "fastapi==0.133.1",
  "uvicorn==0.38.0",
  "prometheus-client==0.24.0",
  "opentelemetry-api==1.39.0",
  # S04 -- Persistence Foundation:
  #   sqlalchemy   async ORM; models live in infrastructure only (ADR-052)
  #   alembic      versioned migrations with declared reversibility (ADR-055)
  #   asyncpg      the async PostgreSQL driver SQLAlchemy dispatches to
  "sqlalchemy==2.0.44",
  "alembic==1.16.5",
  "asyncpg==0.30.0",
  # alembic.ini sets `timezone = UTC` so migration filenames carry a UTC stamp
  # rather than whatever the author's clock said. Alembic resolves that name
  # through `zoneinfo`, which reads the *system* tz database -- and Windows does
  # not ship one. Without this package `alembic revision` fails on Windows with
  # "Can't locate timezone: UTC", so the schema-drift check cannot run there
  # while upgrade and downgrade work perfectly. A platform marker would leave
  # Linux and Windows resolving timezones from different sources, which is
  # exactly the kind of environment-dependent behaviour reproducible builds
  # (ADR-032) exist to remove, so it is installed everywhere.
  "tzdata==2025.2",
  "redis==6.4.0",
  "celery==5.5.3",
  # S06 -- Identity, Secrets Vault & Audit:
  #   cryptography   AES-256-GCM envelope encryption (ADR-020, ADR-070)
  #   pyjwt          access-token signing and verification (ADR-072)
  #   argon2-cffi    password hashing; never reversible (ADR-033)
  "cryptography==50.0.0",
  "pyjwt==2.13.0",
  "argon2-cffi==25.1.0",
  # MVP 1 -- read-only market data:
  #   httpx2   maintained async HTTP transport for the deliberately narrow
  #            documented Kite market-data endpoints (ADR-076)
  "httpx2==2.9.1",
]

[project.optional-dependencies]
# Installed at composition roots and in deployed environments only. Library code
# imports the OpenTelemetry API, never the SDK (ADR-040).
tracing = [
  "opentelemetry-sdk==1.39.0",
  "opentelemetry-exporter-otlp-proto-http==1.39.0",
]

[project.scripts]
dhruva-check-boundaries = "dhruva.tooling.boundaries:main"
dhruva-adr-guard = "dhruva.tooling.adr_guard:main"
# An operator tool and a composition root (ADR-064): it builds an engine from
# settings, which nothing under `tooling` is permitted to do.
dhruva-dlq = "dhruva.workers.dlq:main"

[dependency-groups]
dev = [
  "ruff==0.16.0",
  "mypy==1.18.2",
  "import-linter==2.4",
  "pytest==8.4.2",
  "pytest-cov==7.0.0",
  "pytest-randomly==4.0.1",
  "hypothesis==6.140.3",
  "pip-audit==2.9.0",
  "pytest-benchmark==5.1.0",
  "testcontainers[postgres,redis]==4.9.1",
  "pytest-asyncio==1.2.0",
]

[tool.hatch.version]
path = "src/dhruva/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/dhruva"]

# --------------------------------------------------------------------------- #
# ruff - linting and formatting (section 13.3)
# --------------------------------------------------------------------------- #
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = [".venv*", "*.egg-info"]

[tool.ruff.lint]
select = [
  "E", "W",    # pycodestyle
  "F",         # pyflakes
  "I",         # isort
  "N",         # pep8-naming
  "UP",        # pyupgrade
  "B",         # bugbear
  "A",         # builtins shadowing
  "C4",        # comprehensions
  "DTZ",       # flake8-datetimez - enforces ADR-006 (no naive datetimes)
  "T20",       # no print statements
  "PT",        # pytest style
  "RET",       # return consistency
  "SIM",       # simplify
  "TID",       # tidy imports
  "ARG",       # unused arguments
  "PTH",       # use pathlib
  "ERA",       # commented-out code
  "PL",        # pylint subset
  "TRY",       # exception anti-patterns
  "RUF",       # ruff-specific
  "S",         # bandit security
  "ASYNC",     # async anti-patterns
  "FIX",       # no FIXME/TODO/XXX left in the tree (Golden Rules)
  "D",         # pydocstyle
]
ignore = [
  "D203",   # conflicts with D211
  "D213",   # conflicts with D212
  "TRY003", # long messages in raise are fine and are more useful than terse ones
]

[tool.ruff.lint.per-file-ignores]
# SQLAlchemy's TypeDecorator hooks receive `dialect` whether or not an
# implementation needs it. The parameter is imposed by the framework's signature,
# not dead code we chose to leave.
"src/dhruva/contexts/platform/infrastructure/database/types.py" = ["ARG002"]
# The Unit of Work under test *is* an async context manager whose contract is
# that exceptions escape it. Asserting that requires the `async with` block to
# live inside `pytest.raises`, which PT012 flags. Splitting it would test
# something else.
"tests/unit/persistence/test_unit_of_work.py" = ["PT012"]
# A test of a password hasher has to contain passwords. S105 exists to catch a
# credential committed by accident; these are committed on purpose, are not a
# credential for anything, and the file would be untestable without them.
"tests/unit/identity/test_password_hasher.py" = ["S105", "S106"]
"tests/unit/identity/test_authenticate.py" = ["S105", "S106"]
"tests/integration/test_authentication_flow.py" = ["S105", "S106"]
# The identity use cases assemble audit records from six or seven values, all
# keyword-only. PLR0913 guards against positional argument lists nobody can read
# at the call site; keyword-only parameters are the fix that rule is pointing at,
# and collapsing them into a parameter object here would hide exactly the fields
# an auditor reads -- who acted, on what, with what outcome, under which
# correlation.
"src/dhruva/contexts/platform/application/identity/*.py" = ["PLR0913"]
"tests/**" = [
  "S101",    # assert is the point of a test
  "PLR2004", # magic values are readable in assertions
  "D104",    # package docstrings not required for test packages
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
docstring-code-format = true

# --------------------------------------------------------------------------- #
# mypy - ADR-024: strict, no gradual-typing escape hatch
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
mypy_path = "src"
strict = true
warn_unreachable = true
warn_no_return = true
enable_error_code = [
  "redundant-expr",
  "possibly-undefined",
  "truthy-bool",
  "ignore-without-code",
  "unused-awaitable",
]
# ADR-024: a bare `# type: ignore` is banned; `ignore-without-code` above turns
# one into an error. Any ignore must name the code and link an issue.

# The monetary and time value objects annotate each binary operator with its precise
# operand type, so that `Money + Price` is a *static* error -- which is what
# ADR-043 asks for. They also keep a runtime `isinstance` guard returning
# `NotImplemented`, so an untyped caller gets `TypeError` rather than
# `AttributeError` from a half-executed operation.
#
# mypy correctly deduces that the guard is unreachable *statically*. It is not
# unreachable dynamically. Rather than scatter thirty per-line suppressions
# through the most-read code in the codebase, the check is disabled for this
# package only. Every other module keeps it.
# testcontainers ships no type stubs, and neither does the `docker` client it
# pulls in (the harness pings the daemon with it to decide whether the container
# fixture can run at all). Both are development-only dependencies used by the
# integration harness, and their absence must not fail the type gate for the
# whole project.
[[tool.mypy.overrides]]
module = ["testcontainers.*", "docker.*"]
ignore_missing_imports = true

# Celery ships no `py.typed` marker, so every symbol imported from it is `Any`.
# Unlike the two above this is a *runtime* dependency, and the containment is
# what makes it acceptable: `beat.py` and `celery_app.py` are the only modules
# that import it, both are in the `workers` composition root, and boundary rule
# R9 (ADR-068) fails the build if anything in a domain or strategy package does.
# The decisions themselves are elsewhere and are checked strictly: scheduling in
# `contexts/platform/domain/scheduling`, configuration in `shared/config`.
[[tool.mypy.overrides]]
module = ["celery.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["dhruva.shared.money.*", "dhruva.shared.time.*"]
warn_unreachable = false
# Same reasoning for `redundant-expr`: the runtime guards rejecting `bool` and
# `float` are statically redundant given the annotations, and dynamically the
# only thing standing between a caller and a wrong number.
disable_error_code = ["redundant-expr"]

# --------------------------------------------------------------------------- #
# pytest
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
  "--strict-markers",
  "--strict-config",
  "-ra",
  "--import-mode=importlib",
  # Benchmarks are excluded from the default run for two reasons: they slow the
  # inner loop, and coverage instrumentation inflates their timings enough to
  # make the measurements meaningless (ADR-036). Run them with `make bench`.
  "-m", "not benchmark",
]
markers = [
  "unit: pure logic, no I/O, milliseconds",
  "integration: real PostgreSQL with TimescaleDB via testcontainers (ADR-058)",
  "contract: external adapter contract tests against recorded fixtures",
  "e2e: full journey through the API",
  "slow: takes more than one second",
  "benchmark: performance budget measurement (ADR-036); excluded from the inner loop",
]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
xfail_strict = true
filterwarnings = [
  "error",
  # pytest-asyncio creates an event loop per test. Loops and their internal
  # sockets are collected later, and CPython emits ResourceWarning from
  # __del__ at that point -- which surfaces in whichever unrelated test happens
  # to trigger the collection, producing a failure that moves around between
  # runs. Narrowly ignored rather than relaxing "error" generally: a leak we
  # own would still fail.
  "ignore:unclosed event loop:ResourceWarning",
  "ignore:unclosed <socket.socket:ResourceWarning",
]

# --------------------------------------------------------------------------- #
# coverage - DoD section 10.1
# --------------------------------------------------------------------------- #
# --------------------------------------------------------------------------- #
# mutmut - mutation testing (ADR-049)
# --------------------------------------------------------------------------- #
[tool.mutmut]
# Scoped to the packages where a subtle arithmetic fault produces a plausible
# wrong number rather than a crash. Mutating the FastAPI wiring would cost
# minutes per run to re-confirm what the other gates already establish.
paths_to_mutate = ["src/dhruva/shared/money/", "src/dhruva/shared/time/"]
tests_dir = ["tests/unit/shared/money/", "tests/unit/shared/time/"]
also_copy = ["tests/"]

[tool.coverage.run]
source = ["dhruva"]
branch = true
parallel = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@(abc\\.)?abstractmethod",
]
