# Alembic configuration (ADR-055).
#
# Migrations are versioned DDL with declared reversibility. The script template
# carries the header every migration must fill in, so the declaration is
# impossible to forget rather than merely required.

[alembic]
script_location = alembic
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s
prepend_sys_path = src

# Alembic 1.16 deprecated the legacy splitting of `prepend_sys_path` on spaces,
# commas and colons, and warns when this key is absent. The project runs pytest
# with `filterwarnings = ["error"]`, so that DeprecationWarning is raised as an
# exception inside the `migrated` fixture and every database-backed test errors
# during setup -- a warning about path parsing presenting as a total failure of
# the persistence suite.
#
# `os` selects the platform separator (`;` on Windows, `:` elsewhere), which is
# the forward-compatible behaviour and the correct one for a single relative
# path either way.
path_separator = os

timezone = UTC
truncate_slug_length = 60

# The URL is supplied at runtime from validated settings (ADR-031). It is
# deliberately absent here so a credential cannot end up in a committed file.
sqlalchemy.url =

[post_write_hooks]
hooks = ruff_format
# `exec`, not `console_scripts`. The console_scripts hook resolves the tool
# through `importlib.metadata` entry points *inside Alembic's own process*.
# Recent ruff wheels ship a native binary and no longer register a
# `console_scripts` entry point that lookup can find, so the hook failed with
# "Could not find entrypoint console_scripts.ruff" -- after the revision file had
# already been written, which made a formatting step look like a migration
# failure. `exec` runs the executable from PATH, which under `uv run` is the
# project's own virtualenv.
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
